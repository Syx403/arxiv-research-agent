<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc"><title id="title">A research question becomes an inspectable answer</title><desc id="desc">The main evidence path runs downward. Coverage gaps loop back to retrieval; rejected citations can regenerate the draft. Both loops are bounded. Final output exposes the answer, evidence, and verification status.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6750ae" stroke-width="1.4"/></marker></defs><rect width="1200" height="1280" rx="16" fill="#fbfafc"/>
<text x="56" y="52.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#6750ae">ARXIV RESEARCH AGENT / IMPLEMENTED FLOW</text>
<text x="56" y="112.0" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#202735">Follow the evidence.</text>
<text x="56" y="157.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#566075">A question, two bounded loops, and an answer you can inspect.</text>
<rect x="56" y="196" width="1088" height="72" rx="10" fill="#f1edf9" stroke="#f1edf9" stroke-width="1.5"/>
<text x="80" y="239.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#6750ae">QUESTION</text>
<text x="226" y="241.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#202735">How does ReAct combine reasoning and action?</text>
<path d="M78 323 V1047" stroke="#b8aecb" stroke-width="2"/>
<circle cx="78" cy="327" r="23" fill="#6750ae"/>
<text x="65" y="335.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">01</text>
<text x="128" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#202735">Plan the search</text>
<text x="128" y="359.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#566075">Decompose where needed; route each subquestion.</text>
<text x="128" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#566075">Existing concept memory can add paper hints.</text>
<circle cx="78" cy="493" r="23" fill="#6750ae"/>
<text x="65" y="501.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">02</text>
<rect x="128" y="430" width="526" height="172" rx="10" fill="#ffffff" stroke="#b8aecb" stroke-width="1.5"/>
<text x="150" y="474.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202735">Retrieve and check coverage</text>
<text x="150" y="518.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202735">Vector + keyword search → RRF → rerank</text>
<text x="150" y="552.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#566075">Keep relevant chunks; check missing aspects.</text>
<text x="150" y="585.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#6750ae">Useful evidence survives subsequent retries.</text>
<rect x="770" y="422" width="374" height="198" rx="10" fill="#f1edf9" stroke="#f1edf9" stroke-width="1.5"/>
<text x="792" y="463.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#6750ae">Still missing evidence?</text>
<text x="792" y="505.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202735">Rewrite query (up to 2 retries).</text>
<text x="792" y="535.8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202735">Then, if allowed, follow paper</text>
<text x="792" y="566.6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202735">citations (up to 1 walker call).</text>
<text x="792" y="601.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#566075">Retrieve again; retain earlier hits.</text>
<path d="M654 497 H758" fill="none" stroke="#6750ae" stroke-width="2" marker-end="url(#arrow)" />
<path d="M957 422 V402 H675 V452 H660" fill="none" stroke="#6750ae" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="686" y="578.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6750ae">gap +</text>
<text x="686" y="601.8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6750ae">budget</text>
<path d="M390 602 V660" fill="none" stroke="#6750ae" stroke-width="2" marker-end="url(#arrow)" />
<circle cx="78" cy="711" r="23" fill="#6750ae"/>
<text x="65" y="719.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">03</text>
<rect x="128" y="674" width="526" height="110" rx="10" fill="#ffffff" stroke="#b8aecb" stroke-width="1.5"/>
<text x="150" y="718.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202735">Draft an evidence-linked answer</text>
<text x="150" y="758.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#566075">Each reference names a paper and a chunk.</text>
<path d="M390 784 V838" fill="none" stroke="#6750ae" stroke-width="2" marker-end="url(#arrow)" />
<circle cx="78" cy="900" r="23" fill="#6750ae"/>
<text x="65" y="908.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">04</text>
<rect x="128" y="852" width="526" height="158" rx="10" fill="#ffffff" stroke="#b8aecb" stroke-width="1.5"/>
<text x="150" y="896.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202735">Check each cited claim</text>
<text x="150" y="937.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202735">Resolve exact paper + chunk identity.</text>
<text x="150" y="973.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#566075">Verify the sentence against the full chunk.</text>
<rect x="770" y="809" width="374" height="222" rx="10" fill="#f1edf9" stroke="#f1edf9" stroke-width="1.5"/>
<text x="792" y="852.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#6750ae">Citation rejected?</text>
<text x="792" y="894.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202735">Regenerate with failure notes</text>
<text x="792" y="924.8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202735">while the retry budget allows.</text>
<text x="792" y="971.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#202735">Budget exhausted → keep an</text>
<text x="792" y="1001.8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#202735">explicit UNVERIFIED DRAFT.</text>
<path d="M654 917 H758" fill="none" stroke="#6750ae" stroke-width="2" marker-end="url(#arrow)" />
<path d="M957 809 V716 H666" fill="none" stroke="#6750ae" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M390 1010 V1060" fill="none" stroke="#6750ae" stroke-width="2" marker-end="url(#arrow)" />
<rect x="128" y="1074" width="1016" height="103" rx="10" fill="#6750ae" stroke="#6750ae" stroke-width="1.5"/>
<text x="152" y="1117.0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Answer + source text + per-citation verdicts</text>
<text x="152" y="1154.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#ffffff">Model-assessed support is visible; it is not an independent truth guarantee.</text>
<text x="128" y="1220.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#566075">Persist checkpoints. Learn new concepts only after a passed citation check.</text>
<text x="128" y="1251.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#566075">Offline example: no retrieval or model calls. Browser interfaces: not yet implemented.</text>
</svg>