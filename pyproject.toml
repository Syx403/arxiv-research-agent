[project]
name = "arxiv-research-agent"
version = "0.1.0"
description = "An agent that helps deeply explore the LLM agents literature"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  # Orchestration
  "langgraph>=1.0.10,<2",
  "langgraph-checkpoint>=4.0.1,<5",
  "langgraph-checkpoint-postgres>=3.0.5,<4",
  "langchain-core>=1.3,<2",
  "langsmith>=0.3.45,<1",
  # LLM SDKs
  "openai>=1.50,<2",
  "cohere>=5.11,<6",
  # HTTP
  "httpx>=0.27,<1",
  # DB
  "asyncpg>=0.29,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary,pool]>=3.2,<4",
  # Corpus
  "arxiv>=2.1,<3",
  "pypdf>=5.0,<6",
  "tiktoken>=0.8,<1",
  # Memory graph
  "networkx>=3.3,<4",
  # Config / runtime
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "tenacity>=9.0,<10",
  # UI
  "chainlit>=1.3,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.25,<0.26",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-mock>=3.14,<4",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
