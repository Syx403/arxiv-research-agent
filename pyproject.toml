[project]
name = "ara"
version = "2.0.0.dev0"
description = "arXiv research agent v2: LangGraph orchestration, RAG, verified citations, evaluation"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.13",
  "httpx>=0.28",
  "langgraph>=1.2.14,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langsmith>=0.14.4,<1",
  "lxml>=6",
  "numpy>=2.3",
  "openai>=3.26,<4",
  "pgvector>=0.5",
  "psycopg[binary,pool]>=3.3.6,<4",
  "pyarrow>=21",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "pypdf>=6",
  "tiktoken>=0.14,<1",
]

[project.scripts]
ara = "evals.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.4,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16.10,<0.17",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ara", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real, billable model APIs (opt in with `pytest -m live`)"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.md"]  # ruff would reformat code blocks inside the docs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["›"]  # the heading-path separator

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["ara", "evals", "tests"]
explicit_package_bases = true  # tests/conftest.py and tests/live/conftest.py are distinct modules

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]  # ships without type information
ignore_missing_imports = true
