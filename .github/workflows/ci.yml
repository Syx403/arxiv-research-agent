name: ci

on:
  push:
    branches: [v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    services:
      db:
        image: paradedb/paradedb:0.26.0-pg18
        env:
          POSTGRES_USER: ara
          POSTGRES_PASSWORD: ara
          POSTGRES_DB: ara_test
          PDB_TUNE: "false"
        ports: ["5434:5432"]
        # Over TCP: during first-run initialisation Postgres listens only on its socket.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ara -d ara_test"
          --health-interval 2s --health-timeout 3s --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # this action publishes no moving major tag
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest  # unit tests only; live tests need keys and approval

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0  # pinned below the newest release (v7.1.0 is a day old)
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build  # TypeScript check, then the production bundle
        working-directory: ui
